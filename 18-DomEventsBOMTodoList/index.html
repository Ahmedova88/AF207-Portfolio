<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="./assets/css/style.css">
    <title>Document</title>
</head>
<body>
    <!-- Task1. Calculator -->
    <div class="calculator">
        <div class="enter">
            <input id="enterInput1" style="margin-right: 10px;" type="text" placeholder="Enter the number...">
            <input id="enterInput2" type="text" placeholder="Enter the number...">
        </div>

        <div class="result">
            <input id="resultInput" type="text" placeholder="Result...">
        </div>

        <div class="buttons">
            <button id="plus" class="plus_btn" type="submit">Plus</button>
            <button id="minus" class="minus_btn" type="submit">Minus</button>
            <button id="mult" class="mult_btn" type="submit">Mult</button>
            <button id="devide" class="devide_btn" type="submit">Devide</button>
        </div>
    </div>



    <!-- Task2. TodoList.-->

    <div class="todo-container">
        <div class="addTask">
          <input type="text" id="taskInput" placeholder="Add your task" />
          <button id="addBtn" class="btn" type="submit">Add Task</button>
        </div>
    
        <div class="taskList"></div>
    
        <button id="deleteAllBtn" >DeleteAll</button>
      </div>
    <script src="./assets/js/script.js"></script>
</body>
</html>
