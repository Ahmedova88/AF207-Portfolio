<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" />
  <link rel="stylesheet" href="./assets/css/accountSettings.css">
  <title>Account Settings</title>
</head>
<body>
  <div class="container mt-5">
    <h2 class="text-center mb-4">Account Settings</h2>
    <form id="accountForm">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" id="editUsername" class="form-control" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" id="editEmail" class="form-control" required />
      </div>
      <div class="mb-3">
        <label class="form-label">New Password</label>
        <input type="password" id="editPassword" class="form-control" placeholder="Leave blank to keep current password"/>
      </div>
      <button type="submit" class="btn btn-primary w-100">Save Changes</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="./assets/js/accountSettings.js"></script>
</body>
</html>
